<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libri i Memorieve</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">

        <h1>Libri i Memorieve</h1>
        <br>

        <p class="subtitle">
            Shënoni datën ku filloi gjithqka

        <input
            type="text"
            id="password"
            placeholder="Fjalekalimi"
            autocomplete="off"

        <button id="loginBtn">
            Hape Librin
        </button>

        <p id="error"></p>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
